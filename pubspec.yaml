name: waterlogs
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  cloud_functions: ^5.1.3
  firebase_messaging: ^15.0.0

  # Social login
  kakao_flutter_sdk_common: ^1.10.0
  kakao_flutter_sdk_user: ^1.10.0
  naver_login_sdk: ^3.2.0
  google_sign_in: ^6.2.2

  # State management
  flutter_riverpod: ^2.6.1

  # Navigation
  go_router: ^14.2.7

  # Local prefs (획득 뱃지 다이얼로그 표시 여부, AI 채팅)
  shared_preferences: ^2.3.3

  # HTTP client
  dio: ^5.7.0

  # Immutable models & sealed classes
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # gitignore
  flutter_dotenv: ^6.0.0

  # Charts
  fl_chart: ^0.69.0

  # Local notifications (foreground 푸시 배너용)
  flutter_local_notifications: ^17.2.2
  google_mobile_ads: ^7.0.0
  firebase_crashlytics: ^4.3.10
  pdfx: ^2.9.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

  build_runner: ^2.4.14
  freezed: ^2.5.7
  json_serializable: ^6.7.1

flutter:

  uses-material-design: true

  assets:
    - assets/
    # `assets/` 항목은 직계 파일만 포함되므로 하위 폴더 PDF는 별도 등록 필요
    - assets/legal/privacy_and_terms.pdf
    - .env
